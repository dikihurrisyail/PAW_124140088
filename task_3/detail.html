<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Informasi Pendaftar</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Informasi Pendaftar</h1>
        <p class="subtitle">Berikut adalah data pendaftaran Anda.</p>

        <div class="info-box">
            <table>
                <tr>
                    <th>Nama Lengkap</th>
                    <td id="nama"></td>
                </tr>
                <tr>
                    <th>NIM</th>
                    <td id="nim"></td>
                </tr>
                <tr>
                    <th>Email</th>
                    <td id="email"></td>
                </tr>
                <tr>
                    <th>Program Studi</th>
                    <td id="prodi"></td>
                </tr>
                <tr>
                    <th>Alamat</th>
                    <td id="alamat"></td>
                </tr>
            </table>
        </div>

        <a href="index.html" class="back-button">
            Kembali ke Formulir
        </a>

        <footer>
            <p>Tugas Individu 3 - Pengembangan Aplikasi Web</p>
        </footer>
        
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);

        document.getElementById("nama").textContent =
            params.get("nama") || "-";

        document.getElementById("nim").textContent =
            params.get("nim") || "-";

        document.getElementById("email").textContent =
            params.get("email") || "-";

        document.getElementById("prodi").textContent =
            params.get("prodi") || "-";

        document.getElementById("alamat").textContent =
            params.get("alamat") || "-";
    </script>

</body>
</html>
