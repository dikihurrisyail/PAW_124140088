<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulir Pendaftaran</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Formulir Pendaftaran</h1>
        <p class="subtitle">Silakan isi data diri Anda dengan benar.</p>

        <form action="detail.html" method="get">
            <div class="form-group">
                <label for="nama">Nama Lengkap</label>
                <input
                    type="text"
                    id="nama"
                    name="nama"
                    placeholder="Masukkan nama lengkap"
                    required
                >
            </div>

            <div class="form-group">
                <label for="nim">NIM</label>
                <input
                    type="text"
                    id="nim"
                    name="nim"
                    placeholder="Masukkan NIM"
                    required
                >
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="nama@email.com"
                    required
                >
            </div>

            <div class="form-group">
                <label for="prodi">Program Studi</label>
                <select id="prodi" name="prodi" required>
                    <option value="" disabled selected>
                        Pilih Program Studi
                    </option>
                    <option value="Fisika">
                        Fisika
                    </option>
                    <option value="Biologi">
                        Biologi
                    </option>
                    <option value="Matematika">
                        Matematika
                    </option>
                    <option value="Kimia">
                        Kimia
                    </option>
                    <option value="Farmasi">
                        Farmasi
                    </option>
                    <option value="Sains Data">
                        Sains Data
                    </option>
                    <option value="Sains Aktuaria">
                        Sains Aktuaria
                    </option>
                    <option value="Sains Lingkungan Kelautan">
                        Sains Lingkungan Kelautan
                    </option>
                    <option value="Sains Atmosfir Dan Keplanetan">
                        Sains Atmosfir Dan Keplanetan
                    </option>
                    <option value="Teknik Elektro">
                        Teknik Elektro
                    </option>
                    <option value="Teknik Fisika">
                        Teknik Fisika
                    </option>
                    <option value="Teknik Informatika">
                        Teknik Informatika
                    </option>
                    <option value="Teknik Geologi">
                        Teknik Geologi
                    </option>
                    <option value="Teknik Geofisika">
                        Teknik Geofisika
                    </option>
                    <option value="Teknik Mesin">
                        Teknik Mesin
                    </option>
                    <option value="Teknik Kimia">
                        Teknik Kimia
                    </option>
                    <option value="Teknik Material">
                        Teknik Material
                    </option>
                    <option value="Teknik Sistem Energi">
                        Teknik Sistem Energi
                    </option>
                    <option value="Teknik Industri">
                        Teknik Industri
                    </option>
                    <option value="Teknik Telekomunikasi">
                        Teknik Telekomunikasi
                    </option>
                    <option value="Teknik Pertambangan">
                        Teknik Pertambangan
                    </option>
                    <option value="Teknik Biosistem">
                        Teknik Biosistem
                    </option>
                    <option value="Teknik Biomedis">
                        Teknik Biomedis
                    </option>
                    <option value="Teknologi Pangan">
                        Teknologi Pangan
                    </option>
                    <option value="Teknologi Industri Pertanian">
                        Teknologi Industri Pertanian
                    </option>
                    <option value="Rekayasa Kehutanan">
                        Rekayasa Kehutanan
                    </option>
                    <option value="Rekayasa Kosmetik">
                        Rekayasa Kosmetik
                    </option>
                    <option value="Rekayasa Minyak Dan Gas">
                        Rekayasa Minyak Dan Gas
                    </option>
                    <option value="Rekayasa Instrumentasi Dan Automasi">
                        Rekayasa Instrumentasi Dan Automasi
                    </option>
                    <option value="Rekayasa Keolahragaan">
                        Rekayasa Keolahragaan
                    </option>
                    <option value="Teknik Geomatika">
                        Teknik Geomatika
                    </option>
                    <option value="Perencanaan Wilayah Dan Kota">
                        Perencanaan Wilayah Dan Kota
                    </option>
                    <option value="Teknik Sipil">
                        Teknik Sipil
                    </option>
                    <option value="Arsitektur">
                        Arsitektur
                    </option>
                    <option value="Teknik Lingkungan">
                        Teknik Lingkungan
                    </option>
                    <option value="Teknik Kelautan">
                        Teknik Kelautan
                    </option>
                    <option value="Desain Komunikasi Visual">
                        Desain Komunikasi Visual
                    </option>
                    <option value="Arsitektur Lanskap">
                        Arsitektur Lanskap
                    </option>
                    <option value="Teknik Perkeretaapian">
                        Teknik Perkeretaapian
                    </option>
                    <option value="Rekayasa Tata Kelola Air Terpadu">
                        Rekayasa Tata Kelola Air Terpadu
                    </option>
                    <option value="Pariwisata">
                        Pariwisata
                    </option>
                </select>
            </div>

            <div class="form-group">
                <label for="alamat">Alamat</label>
                <textarea
                    id="alamat"
                    name="alamat"
                    rows="4"
                    placeholder="Masukkan alamat"
                    required
                ></textarea>
            </div>

            <button type="submit">Daftar Sekarang</button>
        </form>

        <footer>
            <p>Tugas Individu 3 - Pengembangan Aplikasi Web</p>
        </footer>
        
    </div>

</body>
</html>
